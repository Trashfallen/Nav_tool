<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav Tool</title>
<script>
  // тема ставится до отрисовки, чтобы не мигало: сохраненный выбор или тема Windows
  (function () {
    var th = null;
    try { th = localStorage.getItem("navtool.theme"); } catch (e) {}
    if (th !== "dark" && th !== "light") th = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = th;
  })();
</script>
<style>
:root {
  --bg: #f3f4f8; --surface: #fff; --surface2: #f8f9fb; --border: #e3e6ec; --text: #161b26; --muted: #667085;
  --accent: #4f46e5; --accent-weak: #eef0ff; --accent-text: #fff;
  --green: #12805c; --green-weak: #e6f6ee; --red: #c0392b; --red-weak: #fdecea; --amber: #b54708; --amber-weak: #fff4e5;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06); --code: #f6f7f9;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1117; --surface: #171a22; --surface2: #1c2029; --border: #2a2f3b; --text: #e7e9ee; --muted: #9098aa;
  --accent: #8b85ff; --accent-weak: #25244a; --accent-text: #0f1117;
  --green: #4fd39a; --green-weak: #16302a; --red: #ff8578; --red-weak: #3a1f1d; --amber: #f5b14c; --amber-weak: #35291a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --code: #12151c;
}
/* переключатель темы: светлая - серая дорожка и белый кружок, темная - зеленая дорожка и черный кружок */
.theme-sw { position: relative; width: 56px; height: 30px; border-radius: 99px; border: 2px solid #d4d6db; padding: 0; cursor: pointer; flex: none;
  background: linear-gradient(90deg, #f1f2f4, #c9cbd0); transition: background .25s, border-color .25s; }
.theme-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .25s, background .25s; }
.theme-sw.dark { background: linear-gradient(90deg, #b6f7a4, #39e639); border-color: #2bd92b; }
.theme-sw.dark::after { left: 28px; background: radial-gradient(circle at 35% 35%, #555, #000 70%); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.grow { flex: 1; }
.i { width: 16px; height: 16px; flex: none; }

button { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover:not(:disabled) { background: var(--accent-weak); border-color: transparent; }
button.danger { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
button.big { padding: 10px 18px; font-size: 15px; }
input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); outline: none; }
input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; flex: none; }
label.fl { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.card-head h2 { margin: 0; font-size: 15px; }
.card-body { padding: 0 16px 16px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--accent-weak); color: var(--accent); font-weight: 600; white-space: nowrap; }
.pill.warn { background: var(--amber-weak); color: var(--amber); }
.pill.ok { background: var(--green-weak); color: var(--green); }
.pill.grey { background: var(--surface2); color: var(--muted); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; }

/* ---------- выбор папки ---------- */
#pick { min-height: 100vh; display: flex; justify-content: center; padding: 48px 16px; }
.pick-wrap { width: 100%; max-width: 820px; }
.pick-wrap h1 { font-size: 26px; margin: 28px 0 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin: 18px 0 22px; }
.rcard { text-align: left; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); white-space: normal; }
.rcard b { font-size: 14px; }
.rcard .p { font-size: 12px; color: var(--muted); word-break: break-all; }
.sec-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 0; }
.browser { overflow: hidden; }
.br-top { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--surface2); }
.br-top button { padding: 4px 10px; font-size: 13px; }
.br-path { display: flex; align-items: center; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.crumb { padding: 2px 6px; border-radius: 6px; cursor: pointer; }
.crumb:hover { background: var(--accent-weak); }
.br-list { max-height: 46vh; overflow: auto; }
.br-item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.br-item:hover { background: var(--accent-weak); }
.br-item.mk { background: var(--green-weak); }
.br-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br-foot { display: flex; gap: 8px; padding: 12px 14px; align-items: center; background: var(--surface2); flex-wrap: wrap; }
.br-foot input { flex: 1; min-width: 200px; }

/* ---------- приложение ---------- */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.proj { flex-direction: column; align-items: flex-start; gap: 0; padding: 4px 10px; max-width: 46vw; min-width: 0; overflow: hidden; }
.proj .pn { font-weight: 700; }
.proj .pp { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.grid { display: grid; grid-template-columns: minmax(0, var(--lw, 53%)) 16px minmax(0, 1fr); padding: 16px 18px 40px; align-items: start; }
@media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 12px; } .tree-card { position: static !important; height: 70vh !important; } .grid > .split { display: none; } }
.split { align-self: stretch; cursor: col-resize; position: relative; touch-action: none; user-select: none; }
.split::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; border-radius: 2px; background: transparent; transition: background .15s; }
.split::after { content: ""; position: sticky; top: 45vh; display: block; margin: 0 auto; width: 6px; height: 44px; border-radius: 4px; background: var(--border); transition: background .15s; }
.split:hover::before, .split.drag::before { background: var(--accent); }
.split:hover::after, .split.drag::after { background: var(--accent); }
body.dragging, body.dragging * { cursor: col-resize !important; user-select: none !important; }
.tree-card { position: sticky; top: 72px; height: calc(100vh - 90px); display: flex; flex-direction: column; }
.tree-tools { display: flex; gap: 8px; padding: 0 16px 10px; align-items: center; }
.tree-tools input { flex: 1; }
#tree { flex: 1; overflow: auto; padding: 0 8px 12px; }
.tr { display: flex; align-items: center; gap: 7px; padding: 4px 8px 4px calc(6px + var(--d) * 18px); border-radius: 8px; min-height: 30px; cursor: default; position: relative; }
.tr:hover { background: var(--surface2); }
.tr.sec { cursor: pointer; }
.tr.sec .ttl { font-weight: 600; }
.tr.on { background: var(--accent-weak); }
.tr.on .ttl { color: var(--accent); }
.tr.here .ttl, .tr.here .ti { color: var(--green); }
.tr.flash { animation: flash 2.2s ease-out; }
@keyframes flash { 0%, 30% { background: var(--green-weak); box-shadow: inset 3px 0 0 var(--green); } 100% { background: transparent; } }
.tw { width: 18px; height: 18px; padding: 0; border: 0; background: none; justify-content: center; color: var(--muted); flex: none; }
.tw .i { width: 14px; height: 14px; transition: transform .15s; }
.tw.open .i { transform: rotate(90deg); }
.ti { color: var(--muted); }
.tr.sec .ti { color: var(--accent); }
.ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pth { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; opacity: .8; }
.cnt { font-size: 11px; color: var(--muted); background: var(--surface2); padding: 0 6px; border-radius: 99px; margin-right: auto; }
.acts { display: none; gap: 2px; margin-left: auto; flex: none; }
.tr:hover .acts, .tr.editing .acts { display: flex; }
.acts button { padding: 5px; border: 0; background: transparent; border-radius: 7px; color: var(--muted); }
.acts button .i { width: 20px; height: 20px; }
.acts button:hover:not(:disabled) { background: var(--surface); color: var(--accent); }
.acts button.del:hover:not(:disabled) { color: var(--red); }
.tr.virt .ttl { font-style: italic; }
.tr.virt .ti { stroke-dasharray: 3 2; }
.gl { align-items: center; }
.gl .rv { margin-left: auto; padding: 2px 6px; border: 0; background: transparent; color: var(--muted); border-radius: 6px; font: 12px "Segoe UI", sans-serif; }
.gl .rv:hover { color: var(--red); background: var(--red-weak); }
.syncbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); }
.yerr { margin: 0 16px 10px; border: 1px solid var(--red); background: var(--red-weak); border-radius: 12px; padding: 12px 14px; color: var(--red); }
.yerr b { display: block; margin-bottom: 4px; }
.yerr pre { margin: 8px 0; background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 0; font: 12px/1.55 Consolas, monospace; overflow: auto; }
.yerr pre div { padding: 0 10px; white-space: pre; }
.yerr pre .bad { background: var(--red-weak); color: var(--red); font-weight: 700; }
.yerr pre .n { display: inline-block; width: 36px; color: var(--muted); user-select: none; }
.ren { padding: 3px 8px !important; max-width: 340px; }
mark { background: var(--amber-weak); color: inherit; border-radius: 3px; }

.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.step { display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
.step-n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-weak); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.step.done .step-n { background: var(--green); color: #fff; }
.step-b { flex: 1; min-width: 0; }
.step-t { font-weight: 700; margin: 2px 0 8px; }
.drop { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: all .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-weak); }
.drop .i { width: 26px; height: 26px; color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filebox { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); }
.filebox .i { width: 22px; height: 22px; color: var(--accent); }
.filebox .fn { font-weight: 600; word-break: break-all; }
.pathline { margin-top: 8px; font: 12px/1.5 Consolas, monospace; background: var(--code); padding: 6px 10px; border-radius: 8px; word-break: break-all; color: var(--muted); }
.pathline b { color: var(--text); font-weight: 600; }
.check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-weak); color: var(--accent); border-radius: 99px; padding: 4px 4px 4px 10px; font-size: 12px; font-weight: 600; max-width: 100%; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { padding: 2px; border: 0; background: none; color: inherit; border-radius: 50%; }
.chip button:hover { background: var(--surface) !important; }
.chip .i { width: 13px; height: 13px; }
.hint { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; }
.seg button.on { background: var(--surface); box-shadow: var(--shadow); color: var(--accent); font-weight: 600; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details input { margin-top: 8px; }
.add-foot { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 12px 16px 16px; border-top: 1px solid var(--border); }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-top: 8px; }
.note .i { margin-top: 1px; }
.note.ok { background: var(--green-weak); color: var(--green); }
.note.warn { background: var(--amber-weak); color: var(--amber); }
.note.err { background: var(--red-weak); color: var(--red); }
.note.info { background: var(--accent-weak); color: var(--accent); }

.glist { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; max-height: 200px; overflow-y: auto; }
.gl { display: flex; gap: 10px; padding: 6px 10px; font: 12px/1.5 Consolas, monospace; border-bottom: 1px solid var(--border); }
.gl:last-child { border-bottom: 0; }
.gl .st { width: 22px; font-weight: 700; flex: none; }
.gl .st.M { color: var(--amber); } .gl .st.A, .gl .st.N { color: var(--green); } .gl .st.D { color: var(--red); }
.gl .fp { word-break: break-all; }
.gstep { margin-top: 14px; }
.gstep .lbl { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
.gstep .row input { flex: 1; min-width: 160px; }
.out { margin-top: 10px; font: 12px/1.5 Consolas, monospace; background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow: auto; }
.mr { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--green-weak); color: var(--green); font-weight: 600; text-decoration: none; }

.tabs2 { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.tabs2 button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 10px; color: var(--muted); }
.tabs2 button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tabs2 .c { font-size: 11px; background: var(--surface2); border-radius: 99px; padding: 0 6px; }
.clist { max-height: 300px; overflow: auto; }
.ci { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
.ci:last-child { border-bottom: 0; }
.ci .b { flex: 1; min-width: 0; }
.ci .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ci .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 18px 16px; color: var(--muted); display: flex; gap: 8px; align-items: center; }

.modal { position: fixed; inset: 0; background: rgba(10,12,20,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-box { background: var(--surface); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); width: 100%; max-width: 760px; max-height: 90vh; display: flex; flex-direction: column; }
.modal-box.wide { max-width: 98vw; width: min(1500px, 98vw); height: 92vh; max-height: 98vh; min-width: 560px; min-height: 380px; resize: both; overflow: hidden; }
.modal.fullmode { padding: 0; }
.modal-box.wide.full { width: 100vw !important; height: 100vh !important; max-width: none; max-height: none; border-radius: 0; resize: none; }
.modal-box.wide .modal-body { flex: 1; display: flex; flex-direction: column; min-height: 0; padding-bottom: 0; overflow: hidden; }
.ed-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.ed-bar .fname { font: 600 13px Consolas, monospace; word-break: break-all; }
.ed { flex: 1; display: grid; grid-template-columns: minmax(0, var(--ew, 50%)) 14px minmax(0, 1fr); min-height: 0; }
.ed.nopv { grid-template-columns: 1fr; }
.ed.nopv .split { display: none; }
.ed .split::after { position: absolute; top: 50%; left: 50%; margin: -22px 0 0 -3px; }
@media (max-width: 900px) { .ed { grid-template-columns: 1fr; } .ed .pv, .ed .split { display: none; } }
.ed-code { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--code); min-height: 0; }
.ed-code:focus-within { border-color: var(--accent); }
.mdbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 4px 6px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2); }
.mdbar button { border: 0; background: transparent; padding: 0; width: 32px; height: 30px; justify-content: center; border-radius: 7px; color: var(--text); font: 600 13px "Segoe UI", sans-serif; }
.mdbar button:hover { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.mdbar button .i { width: 17px; height: 17px; }
.mdbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 5px; }
.imgdrop { margin: 4px 10px; border: 2px dashed var(--border); border-radius: 10px; padding: 14px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; color: var(--muted); }
.imgdrop.over { border-color: var(--accent); background: var(--accent-weak); }
.imgdrop .i { width: 26px; height: 26px; color: var(--accent); }
#imPrev { display: block; max-width: calc(100% - 20px); max-height: 170px; margin: 6px auto; border-radius: 8px; border: 1px solid var(--border); }
.fprow { display: flex; gap: 6px; align-items: center; }
.fprow input { flex: 1; }
.fpi { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px calc(8px + var(--d) * 16px); border-radius: 7px; cursor: pointer; }
.fpi:hover { background: var(--accent-weak); }
.fpi.sel { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.fpi .tw { width: 16px; height: 16px; }
.fpi .add { margin-left: auto; padding: 2px 6px; border: 0; background: none; color: var(--muted); border-radius: 6px; visibility: hidden; }
.fpi:hover .add { visibility: visible; }
.fpi .add:hover { color: var(--accent); background: var(--surface); }
#updBtn.has { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
.mdbar .pbtn { width: auto; padding: 0 10px; gap: 6px; color: var(--accent); }
.pmenu { position: absolute; z-index: 70; width: 360px; max-height: 62vh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 6px; }
.pmenu .pg { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px 4px; }
.pmenu .pi { display: flex; align-items: flex-start; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.pmenu .pi:hover { background: var(--accent-weak); }
.pmenu .pi .d { font-size: 12px; color: var(--muted); }
.pmenu .pi .x { margin-left: auto; padding: 2px 6px; border: 0; background: none; color: var(--muted); border-radius: 6px; }
.pmenu .pi .x:hover { color: var(--red); background: var(--red-weak); }
.mdbar .h { font-size: 12px; letter-spacing: -.02em; }
.mdbar .h sub { font-size: 9px; }
.ed-head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 10px; }
.ed-head .ttl2 { display: flex; gap: 8px; align-items: center; font-size: 16px; font-weight: 700; }
.ed-head .ttl2 .i { width: 20px; height: 20px; color: var(--accent); }
.ed-meta { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 4px; }
.ed-meta span { display: inline-flex; gap: 5px; align-items: center; }
.ed-meta b { color: var(--text); font-weight: 600; }
.ed-meta .i { width: 14px; height: 14px; }

async function api(url, body) {
  let r;
  try {
    r = await fetch(url, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  } catch (e) {
    // программа (окно run.bat) не отвечает: одна понятная плашка вместо «Failed to fetch»
    showOffline();
    const err = new Error("Нет связи с программой");
    err.offline = true;
    throw err;
  }
  hideOffline();
  const j = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let offlineTimer = null;
function showOffline() {
  if ($("#offline") || window._updating) return;
  const el = document.createElement("div");
  el.id = "offline";
  el.innerHTML = `${ic("warn")}<span><b>Нет связи с программой.</b> Скорее всего, закрыто окно run.bat или программа перезапускается.
    Запусти run.bat снова: страница переподключится сама, ничего не потеряется.</span>`;
  document.body.appendChild(el);
  clearInterval(offlineTimer);
  offlineTimer = setInterval(async () => {
    try {
      const r = await fetch("/api/home", {cache: "no-store"});
      if (r.ok) { hideOffline(); if (S) load(); toast("Связь с программой восстановлена", "info", 2500); }
    } catch (e) {}
  }, 2000);
}
function hideOffline() {
  if (offlineTimer) { clearInterval(offlineTimer); offlineTimer = null; }
  const el = $("#offline"); if (el) el.remove();
}
function toast(text, kind = "ok", ms = 3500, withUndo = false) {
  if (text === "Нет связи с программой") return;  // про это уже говорит плашка сверху
  if ([...document.querySelectorAll("#toasts .toast span")].some(s => s.textContent === text)) return;  // без дублей
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = (kind === "ok" ? ic("check") : kind === "err" ? ic("warn") : ic("info")) + `<span>${esc(text)}</span>`;
  if (withUndo) {
    // кнопка отката прямо в сообщении; старые такие сообщения убираем, чтобы откат относился к последнему действию
    document.querySelectorAll(".toast.hasundo").forEach(x => x.remove());
    el.classList.add("hasundo");
    const b = document.createElement("button");
    b.className = "tundo"; b.textContent = "Отменить";
    b.onclick = () => { el.remove(); undoLast(); };
    el.appendChild(b);
  }
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "err" ? 8000 : withUndo ? 10000 : ms);
}
const toastUndo = text => toast(text, "ok", 10000, true);
function modal(title, body, buttons) {
  svModal = false;
  modalGuard = null;
  resetModalBox();
  $("#mTitle").textContent = title;

let S = null, K = [], byKey = {};

let pending = [];                // пустые разделы, которых еще нет в nav: {pk, title, dir}
const VK = (pk, title) => "V" + pk + "\u0001" + title;

function keyOf(id) {
  const parts = []; let n = S.nodes[id];
  while (n) { parts.unshift(n.path || n.title); n = n.parent === null ? null : S.nodes[n.parent]; }
  return parts.join("\u0001");
}
function vOf(k) { return pending.find(v => VK(v.pk, v.title) === k); }
// пустые разделы могут быть вложены друг в друга: поднимаемся до настоящего раздела и собираем цепочку названий
function vChain(k) {
  const titles = []; let cur = k, v;
  while ((v = vOf(cur))) { titles.unshift(v.title); cur = v.pk; }
  return {id: byKey[cur], key: cur, titles};
}
function targetOf(k) { if (!vOf(k)) return byKey[k]; const c = vChain(k); return {id: c.id, sub: c.titles}; }
function crumbK(k) { if (!vOf(k)) return crumb(byKey[k]); const c = vChain(k); return crumb(c.id) + " › " + c.titles.join(" › "); }
function vDescendants(k) { const out = [k]; pending.filter(v => v.pk === k).forEach(v => out.push(...vDescendants(VK(v.pk, v.title)))); return out; }
function hintK(k) { const v = vOf(k); return v ? v.dir : (S.nodes[byKey[k]].hint || ""); }
function crumb(id) {
  const p = []; let n = S.nodes[id];
  while (n && n.id !== 0) { p.unshift(n.title); n = S.nodes[n.parent]; }

}

async function load(repo, flashKeys) {
  let st;
  try { st = await api("/api/state?repo=" + encodeURIComponent(repo || S.repo)); } catch (e) { toast(e.message, "err"); return false; }
  const first = !S || S.repo !== st.repo;
  S = st;
  K = S.nodes.map(n => keyOf(n.id));
  byKey = {}; K.forEach((k, i) => byKey[k] = i);
  if (first) {
    openK = new Set([K[0]]); S.nodes[0].children.forEach(c => { openK.add(K[c]); S.nodes[c].children.forEach(g => !S.nodes[g].path && openK.add(K[g])); });
  }
  // пустой раздел, в который уже добавили страницу, становится настоящим
  for (let changed = true; changed;) {
    changed = false;
    pending = pending.filter(v => {
      if (v.pk in byKey) {
        const real = S.nodes[byKey[v.pk]].children.find(c => !S.nodes[c].path && S.nodes[c].title === v.title);
        if (real === undefined) return true;
        const vk = VK(v.pk, v.title), rk = K[real];
        if (checkedK.has(vk)) { checkedK.delete(vk); checkedK.add(rk); }
        pending.forEach(x => { if (x.pk === vk) x.pk = rk; });
        openK.add(rk); changed = true;
        return false;
      }
      if (pending.some(x => VK(x.pk, x.title) === v.pk)) return true;
      changed = true;
      return false;
    });
  }
  checkedK = new Set([...checkedK].filter(k => k in byKey || pending.some(v => VK(v.pk, v.title) === k)));
  document.title = "Nav Tool: " + S.name;
  $("#projName").textContent = S.name; $("#projPath").textContent = S.repo;
  document.querySelectorAll(".docsName").forEach(e => e.textContent = S.docs_dir);
  $("#dirList").innerHTML = S.dirs.map(d => `<option value="${esc(d)}">`).join("");
  $("#treeInfo").textContent = `${S.nodes.filter(n => n.path).length} страниц`;
  renderTop(); renderYmlErr(); renderTree(flashKeys); renderForm(); renderGit(); renderChecks();
  if (first) { ftCache = {}; ftOpen = new Set([""]); setLeftTab(prefGet("navtool.lefttab") || "nav"); }
  else if (leftTab === "files") { ftCache = {}; renderFiles2(); }
  return true;
}

const countCache = {};
function pageCount(id) { return S.nodes[id].children.reduce((a, c) => a + (S.nodes[c].path ? 1 : pageCount(c)), 0); }
function hl(t, q) {
  t = t || ""; if (!q) return esc(t);
  const i = t.toLowerCase().indexOf(q);
  return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));

function renderTree(flashKeys) {
  const q = search.trim().toLowerCase();
  let vis = null;
  if (q) {
    vis = new Set();
    S.nodes.forEach(n => {
      if ((n.title || "").toLowerCase().includes(q) || (n.path || "").toLowerCase().includes(q)) {
        let c = n; while (c) { vis.add(c.id); c = c.parent === null ? null : S.nodes[c.parent]; }
      }
    });
  }
  const cur = currentPath();
  const out = [];
  const walk = (id, d) => {
    const n = S.nodes[id];
    if (vis && !vis.has(id)) return;
    if (n.path && !showPages && !q) return;
    const sibs = n.parent === null ? [id] : S.nodes[n.parent].children;
    const pos = sibs.indexOf(id);
    const virt = n.path ? [] : pending.filter(v => v.pk === K[id]);
    const isOpen = !n.path && (q ? true : openK.has(K[id]));
    const hasKids = n.children.length + virt.length > 0;
    const cls = ["tr", n.path ? "pg" : "sec", checkedK.has(K[id]) ? "on" : "", cur && n.path === cur ? "here" : "",
                 flashKeys && flashKeys.includes(K[id]) ? "flash" : ""].join(" ");
    out.push(`<div class="${cls}" data-id="${id}" style="--d:${d}">
      ${n.path ? `<span class="tw"></span>` : `<button class="tw ${isOpen ? "open" : ""}" data-act="toggle" ${hasKids ? "" : "disabled"}>${hasKids ? ic("chev") : ""}</button>`}
      ${n.path ? "" : `<input type="checkbox" data-act="check" ${checkedK.has(K[id]) ? "checked" : ""} title="Добавить сюда">`}
      ${ic(n.path ? "file" : "folder", "ti")}
      <span class="ttl">${hl(n.title, q)}</span>
      ${n.path ? `<span class="pth" title="${esc(n.path)}">${hl(n.path, q)}</span>` : `<span class="cnt">${pageCount(id) || ""}</span>`}
      ${!id ? `<span class="acts"><button data-act="newpage" title="Новая страница">${ic("filePlus")}</button><button data-act="addsec" title="Новый раздел внутри">${ic("folderPlus")}</button></span>` : ""}
      ${id ? `<span class="acts">
        ${n.path ? "" : `<button data-act="newpage" title="Новая страница в этом разделе">${ic("filePlus")}</button><button data-act="addsec" title="Новый раздел внутри">${ic("folderPlus")}</button>`}
        ${n.path && SV.state === "running" && SV.repo === S.repo ? `<button data-act="site" title="Открыть на локальном сайте">${ic("ext")}</button>` : ""}
        ${n.path && /\.(md|markdown)$/i.test(n.path) ? `<button data-act="editfile" title="Открыть в редакторе">${ic("code")}</button>` : ""}
        <button data-act="rename" title="Переименовать">${ic("edit")}</button>
        <button data-act="up" title="Выше" ${pos === 0 ? "disabled" : ""}>${ic("up")}</button>
        <button data-act="down" title="Ниже" ${pos === sibs.length - 1 ? "disabled" : ""}>${ic("down")}</button>
        <button data-act="delete" class="del" title="Убрать из меню">${ic("trash")}</button></span>` : ""}
    </div>`);
    if (isOpen) {
      n.children.forEach(c => walk(c, d + 1));
      const renderVirt = (pk, dd) => pending.filter(v => v.pk === pk).forEach(v => {
        const k = VK(v.pk, v.title);
        out.push(`<div class="tr sec virt ${checkedK.has(k) ? "on" : ""} ${flashKeys && flashKeys.includes(k) ? "flash" : ""}" data-v="${esc(k)}" style="--d:${dd}">
          <span class="tw"></span><input type="checkbox" data-act="vcheck" ${checkedK.has(k) ? "checked" : ""} title="Добавить сюда">
          ${ic("folder", "ti")}<span class="ttl">${esc(v.title)}</span>
          <span class="pill grey" title="В mkdocs.yml появится вместе с первой страницей">пустой</span>
          <span class="acts">
            <button data-act="vnewpage" title="Новая страница в этом разделе">${ic("filePlus")}</button>
            <button data-act="vaddsec" title="Новый раздел внутри">${ic("folderPlus")}</button>
            <button data-act="vdel" class="del" title="Убрать пустой раздел">${ic("trash")}</button></span></div>`);
        renderVirt(k, dd + 1);
      });
      if (!q) renderVirt(K[id], d + 1);
    }
  };
  walk(0, 0);
  $("#tree").innerHTML = out.join("") || `<div class="empty">${ic("info")}Ничего не найдено</div>`;
  const f = $("#tree .flash"); if (f) f.scrollIntoView({block: "center", behavior: "smooth"});
}
function toggleKey(k, on) {
  on ? checkedK.add(k) : checkedK.delete(k);

  renderTree(); renderForm();
}

$("#tree").addEventListener("click", e => {
  const row = e.target.closest(".tr"); if (!row || row.classList.contains("editing")) return;
  if (row.dataset.v) {
    const a = e.target.closest("[data-act]"), k = row.dataset.v;
    if (a && a.dataset.act === "vcheck") toggleKey(k, a.checked);
    else if (a && a.dataset.act === "vaddsec") newSection(k);
    else if (a && a.dataset.act === "vnewpage") newPage(k);
    else if (a && a.dataset.act === "vdel") {
      const gone = new Set(vDescendants(k));
      pending = pending.filter(v => !gone.has(VK(v.pk, v.title)));
      gone.forEach(x => checkedK.delete(x));
      renderTree(); renderForm();
    }
    return;
  }
  const id = +row.dataset.id, n = S.nodes[id];
  const actEl = e.target.closest("[data-act]");
  const act = actEl ? actEl.dataset.act : (n.path ? null : "toggle");
  if (act === "check") { toggleCheck(id, actEl.checked); return; }
  if (act === "toggle") { openK.has(K[id]) ? openK.delete(K[id]) : openK.add(K[id]); renderTree(); return; }
  if (act === "site") { window.open(pageUrl(n.path), "_blank"); return; }
  if (act === "editfile") return openEditor(n.path);
  if (act === "addsec") return newSection(K[id]);
  if (act === "newpage") return newPage(K[id]);
  if (act === "rename") return startRename(row, id);
  if (act === "up" || act === "down") return op(act, id);
  if (act === "delete") return navDelete(id);
});

const memPrefs = {};
function prefGet(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return memPrefs[k] ?? null; }
function prefSet(k, v) { memPrefs[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
function makeSplitter(split, box, cssVar, key, def, min, max) {
  const apply = v => box.style.setProperty(cssVar, v + "%");
  const saved = parseFloat(prefGet(key));
  apply(isNaN(saved) ? def : saved);
  split.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    split.setPointerCapture(e.pointerId);
    split.classList.add("drag"); document.body.classList.add("dragging");
    const r = box.getBoundingClientRect();
    const move = ev => {
      const pct = Math.min(max, Math.max(min, (ev.clientX - r.left) / r.width * 100));
      apply(pct.toFixed(1)); prefSet(key, pct.toFixed(1));
    };
    const up = () => {
      split.classList.remove("drag"); document.body.classList.remove("dragging");
      split.removeEventListener("pointermove", move); split.removeEventListener("pointerup", up); split.removeEventListener("pointercancel", up);
    };
    split.addEventListener("pointermove", move); split.addEventListener("pointerup", up); split.addEventListener("pointercancel", up);
  });
  split.addEventListener("dblclick", () => { apply(def); prefSet(key, String(def)); });
}

// в предпросмотре скрипты запрещены, поэтому диаграмму рисуем здесь и вставляем туда готовый SVG
let mermaidState = null;  // null, "loading", "ok", "fail"
const mermaidCache = new Map();  // текст диаграммы + тема -> svg или ошибка
let mermaidSeq = 0;
function loadMermaid() {
  if (mermaidState === "ok" || mermaidState === "fail") return Promise.resolve(mermaidState);
  if (window._mermaidLoading) return window._mermaidLoading;
  mermaidState = "loading";
  window._mermaidLoading = new Promise(res => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js";
    s.onload = () => {
      try {
        window.mermaid.initialize({startOnLoad: false, securityLevel: "strict",
          theme: isDark() ? "dark" : "default"});
        mermaidState = "ok";
      } catch (e) { mermaidState = "fail"; }
      res(mermaidState);
    };
    s.onerror = () => { mermaidState = "fail"; res(mermaidState); };
    setTimeout(() => { if (mermaidState === "loading") { mermaidState = "fail"; res(mermaidState); } }, 10000);
    document.head.appendChild(s);
  });
  return window._mermaidLoading;
}
async function renderMermaidIn(doc) {
  const blocks = [...doc.querySelectorAll("pre.mermaid, pre > code.language-mermaid")].map(el => el.closest("pre") || el);
  if (!blocks.length) return;
  const st = await loadMermaid();
  for (const pre of blocks) {
    if (!pre.isConnected) continue;
    const code = pre.textContent.trim();
    const box = doc.createElement("div");
    box.className = "mmd";
    if (st !== "ok") {
      box.innerHTML = `<div class="mmd-err">Диаграмма Mermaid не отрисована: библиотека не загрузилась (нужен интернет). На сайте она будет.</div>`;
      pre.before(box);
      continue;
    }
    let res = mermaidCache.get(code);
    if (!res) {
      try {
        const out = await window.mermaid.render("mmd" + (++mermaidSeq), code);
        res = {svg: out.svg};
      } catch (e) {
        res = {err: String(e && e.message || e).split("\n").slice(0, 3).join("\n")};
        document.querySelectorAll("body > [id^='dmmd']").forEach(x => x.remove());  // хвосты неудачного рендера
      }
      if (mermaidCache.size > 50) mermaidCache.delete(mermaidCache.keys().next().value);
      mermaidCache.set(code, res);
    }
    if (!pre.isConnected) continue;
    box.innerHTML = res.svg || `<div class="mmd-err">Ошибка в диаграмме Mermaid: ${esc(res.err)}</div>`;
    pre.replaceWith(box);
  }
}

function withFolderPicker(input) {

  wrap.appendChild(b);
  b.onclick = () => openFolderPicker(input, b);
}
let fpEl = null;
function closeFolderPicker() { if (fpEl) { fpEl.remove(); fpEl = null; } }
async function openFolderPicker(input, anchor) {
  if (fpEl) return closeFolderPicker();
  const open = new Set([""]), cache = {};
  let sel = input.value.trim().replace(/\\/g, "/").replace(/^\/+|\/+$/g, ""), adding = null;
  sel.split("/").reduce((acc, part) => { const p = acc ? acc + "/" + part : part; if (part) open.add(acc); return p; }, "");
  const dirsOf = async rel => cache[rel] || (cache[rel] = (await api("/api/ls?repo=" + encodeURIComponent(S.repo) + "&path=" + encodeURIComponent(rel))).entries.filter(e => e.dir));
  fpEl = document.createElement("div");
  fpEl.className = "pmenu"; fpEl.style.width = "420px";
  document.body.appendChild(fpEl);
  const r = anchor.getBoundingClientRect();
  fpEl.style.left = Math.max(8, Math.min(r.right - 420, innerWidth - 436)) + "px";
  fpEl.style.top = Math.max(8, Math.min(r.bottom + 6, innerHeight - 380)) + "px";
  const draw = async () => {
    for (const d of [...open]) { try { await dirsOf(d); } catch (e) { open.delete(d); } }
    const rows = [];
    const row = (rel, name, d, hasKids) => rows.push(`<div class="fpi ${rel === sel ? "sel" : ""}" data-r="${esc(rel)}" style="--d:${d}">
      <span class="tw" data-tg="1">${hasKids ? (open.has(rel) ? "▾" : "▸") : ""}</span>${ic("folder")}<span>${esc(name)}</span>
      <button class="add" data-add="${esc(rel)}" title="Новая папка внутри">${ic("folderPlus")}</button></div>
      ${adding === rel ? `<div class="fpi" style="--d:${d + 1};cursor:default"><input type="text" id="fpNew" placeholder="имя новой папки" style="padding:4px 8px"><button class="primary" id="fpMk">Создать</button></div>` : ""}`);
    const walk = (rel, d) => (cache[rel] || []).forEach(e => { row(e.path, e.name, d, e.count > 0); if (open.has(e.path)) walk(e.path, d + 1); });
    row("", S.docs_dir + "/", 0, true);
    walk("", 1);
    fpEl.innerHTML = `<div class="pg">Папка внутри ${esc(S.docs_dir)}/</div><div style="max-height:320px;overflow:auto">${rows.join("")}</div>
      <div class="row" style="padding:8px 10px;justify-content:flex-end"><button id="fpCancel">Отмена</button><button class="primary" id="fpOk">Выбрать${sel ? ": " + esc(sel) : " корень"}</button></div>`;
    if ($("#fpNew")) { $("#fpNew").focus(); $("#fpNew").onkeydown = e => { if (e.key === "Enter") $("#fpMk").click(); if (e.key === "Escape") { adding = null; draw(); } }; }
  };
  fpEl.addEventListener("click", async e => {
    if (e.target.closest("#fpCancel")) return closeFolderPicker();
    if (e.target.closest("#fpOk")) { input.value = sel; input.dispatchEvent(new Event("input")); return closeFolderPicker(); }
    if (e.target.closest("#fpMk")) {
      const name = $("#fpNew").value.trim();
      if (!name) return;
      try {
        const res = await api("/api/mkdir", {repo: S.repo, dir: adding, name: slug(name)});
        delete cache[adding]; open.add(adding); sel = res.path; adding = null; ftCache = {};
        toast(res.message, "ok", 2500);
      } catch (x) { toast(x.message, "err"); }
      return draw();
    }
    const add = e.target.closest("[data-add]");
    if (add) { adding = add.dataset.add; open.add(adding); return draw(); }
    const rw = e.target.closest("[data-r]");
    if (rw) {
      const rel = rw.dataset.r;
      if (e.target.closest("[data-tg]") && rel) { open.has(rel) ? open.delete(rel) : open.add(rel); return draw(); }
      sel = rel; open.add(rel); return draw();
    }
  });
  fpEl.addEventListener("dblclick", e => { const rw = e.target.closest("[data-r]"); if (rw) { sel = rw.dataset.r; fpEl.querySelector("#fpOk").click(); } });
  await draw();
}

  if (fm) { const m = fm[1].match(/^title\s*:\s*(.+)$/m); if (m) return m[1].trim().replace(/^['"]|['"]$/g, ""); }
  const h = t.match(/^#\s+(.+?)\s*#*\s*$/m);
  return h ? h[1].trim() : fallback;
}

  api("/api/git", {repo: S.repo, op: "branches"}).then(r => {
    if (!$("#gBrList")) return;
    $("#gBrList").innerHTML = r.branches.map(b => `<option value="${esc(b.name)}" label="${esc((b.current ? "текущая" : b.local ? "своя" : "с сервера") + (b.date ? ", " + b.date : ""))}">`).join("");
  }).catch(() => {});
  $("#gSwBtn").onclick = () => {
    const name = $("#gSw").value.trim();
    if (!name) { toast("Выбери ветку из списка", "info"); return; }
    if (name === g.branch) { toast("Ты уже на этой ветке", "info"); return; }
    if (!ch.length) return switchBranch(name);
    modal("Переключить ветку?", `<div>С <b>${esc(g.branch)}</b> на <b>${esc(name)}</b></div>
      <div class="note warn">${ic("warn")}<span>Есть незакоммиченные изменения (${ch.length}). Они перейдут в ветку ${esc(name)}.
        Если они мешают переключению, программа предложит отложить, закоммитить или сбросить их.</span></div>`,
      [{text: "Отмена"}, {text: ic("branch") + "Переключить", cls: "primary", onClick: () => switchBranch(name)}]);
  };
  $("#gSw").addEventListener("keydown", e => { if (e.key === "Enter") $("#gSwBtn").click(); });
  $("#gCommit").onclick = () => gitOp("commit", {message: $("#gMsg").value.trim()});
  $("#gPush").onclick = () => modal("Запушить?", `<div>Ветка <b>${esc(g.branch)}</b> уйдет в <b>origin</b>${g.origin ? `<div class="small muted" style="margin-top:4px;word-break:break-all">${esc(g.origin)}</div>` : ""}</div>
      ${master ? `<div class="note warn">${ic("warn")}<span>Это основная ветка. Обычно пушат ветку задачи и делают MR.</span></div>` : ""}
      ${ch.length ? `<div class="note info">${ic("info")}<span>Есть незакоммиченные изменения, они не уйдут. Сначала закоммить.</span></div>` : ""}`,
      [{text: "Отмена"}, {text: ic("push") + "Запушить", cls: "primary", onClick: () => gitOp("push")}]);
}
function discard(paths) {
  const all = paths === "all";
  const list = all ? S.git.status.map(l => l.slice(3)) : paths;
  modal(all ? "Сбросить все изменения?" : "Отменить изменения в файле?", `
    <div class="glist">${list.map(p => `<div class="gl"><span class="fp">${esc(p)}</span></div>`).join("")}</div>
    <div class="note info">${ic("info")}<span>Измененные файлы вернутся к последнему коммиту, новые файлы и папки уберутся.
      Копия уходит в корзину инструмента, вернуть можно кнопкой «Отменить» в сообщении внизу или вверху справа.</span></div>`,
    [{text: "Оставить"}, {text: ic("undo") + (all ? "Сбросить все" : "Отменить изменения"), cls: "danger", onClick: async () => {
      try { const r = await api("/api/discard", {repo: S.repo, paths}); toastUndo(r.message); } catch (e) { toast(e.message, "err"); }
      await load();
    }}]);
}
async function switchBranch(name, mode, message) {
  let r;
  try { r = await api("/api/git", {repo: S.repo, op: "switch", name, mode, message}); }
  catch (e) { gitOut = {output: e.message}; toast(e.message, "err"); await load(); return; }
  if (!r.conflict) { gitOut = r; toast(r.message); await load(); return; }
  const cur = S.git.branch;
  modal("Правки мешают переключить ветку", `
    <div>Git не может переключиться на <b>${esc(name)}</b>: в этих файлах есть незакоммиченные правки, а в той ветке они другие.</div>
    <div class="glist" style="margin-top:8px">${r.files.map(f => `<div class="gl"><span class="fp">${esc(f)}</span></div>`).join("")}</div>
    <div class="note info" style="margin-top:10px">${ic("info")}<span><b>Отложить</b>: правки уберутся в «Отложенные правки» в блоке Git, потом вернешь их кнопкой «Вернуть сюда» (обычно на этой же ветке).<br>
      <b>Закоммитить</b>: правки сохранятся коммитом в ветку ${esc(cur)}.<br>
      <b>Сбросить</b>: правки уйдут в корзину программы, вернуть можно кнопкой «Отменить».</span></div>
    <label class="fl">Сообщение коммита (для «Закоммитить»)</label><input type="text" id="swMsg" value="${esc(suggestMsg() || "Правки перед переключением ветки")}">`,
    [{text: "Отмена"},
     {text: ic("trash") + "Сбросить", cls: "danger", onClick: () => switchBranch(name, "discard")},
     {text: ic("commit") + "Закоммитить", onClick: () => switchBranch(name, "commit", $("#swMsg").value)},
     {text: ic("download") + "Отложить и переключить", cls: "primary", onClick: () => switchBranch(name, "stash")}]);
  return true;  // окно выбора уже открыто: вызывающее окно не должно его закрыть
}
async function gitOp(kind, extra = {}) {
  const btns = document.querySelectorAll("#gitBody button"); btns.forEach(b => b.disabled = true);
  const busy = {sync: "gSync", merge_base: "gMerge", push: "gPush", commit: "gCommit", switch: "gSwBtn"}[kind];
  if (busy && $("#" + busy)) $("#" + busy).innerHTML = ic("loader", "spin") + "Подожди...";
  try {
    const r = await api("/api/git", {repo: S.repo, op: kind, ...extra});
    gitOut = r; toast(r.message);
    if (kind === "commit") { lastAdded = null; $("#gMsg").value = ""; }
    if (kind === "branch") $("#gBr").value = "";
  } catch (e) { gitOut = {output: e.message}; toast(kind === "push" ? "Push не прошел, подробности в блоке Git" : e.message, "err"); }
  await load();
}

/* ================= проверка ================= */
function renderChecks() {
  const orph = S.files.filter(f => !f.in_nav.length);
  $("#cOrph").textContent = orph.length; $("#cMiss").textContent = S.missing.length;
  document.querySelectorAll(".tabs2 button").forEach(b => b.classList.toggle("on", b.dataset.t === checkTab));
  if (checkTab === "orph") {
    $("#clist").innerHTML = orph.length ? orph.map(f => `<div class="ci">${ic("file", "ti")}<div class="b"><div class="t">${esc(f.title)}</div><div class="s">${esc(f.path)}</div></div>
      <button data-add="${esc(f.path)}">${ic("plus")}В меню</button></div>`).join("")
      : `<div class="empty">${ic("check")}Все md-файлы есть в меню</div>`;
  } else {
    $("#clist").innerHTML = S.missing.length ? S.missing.map(m => `<div class="ci">${ic("warn", "ti")}<div class="b"><div class="t">${esc(m.title)}</div><div class="s">${esc(m.where)} : ${esc(m.path)}</div></div>
      <button data-rm="${m.id}">${ic("trash")}Убрать</button></div>`).join("")
      : `<div class="empty">${ic("check")}Все ссылки в меню ведут на существующие файлы</div>`;
  }
}
document.querySelector(".tabs2").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (b) { checkTab = b.dataset.t; renderChecks(); } });
$("#clist").addEventListener("click", e => {
  const a = e.target.closest("[data-add]"); if (a) { useRepoFile(a.dataset.add); toast("Теперь отметь разделы слева", "info"); return; }
  const r = e.target.closest("[data-rm]"); if (r) op("delete", +r.dataset.rm);
});

/* ================= локальный сайт ================= */
let SV = {state: "idle", log: []}, svTimer = null, svModal = false;
function pageUrl(path) {
  let u = path.replace(/\.md$/i, "");
  u = /(^|\/)(index|README)$/i.test(u) ? u.replace(/(index|README)$/i, "") : u + "/";
  return SV.url + u.replace(/^\//, "");
}
function svLabel() {
  const mine = SV.repo === (S && S.repo);
  if (SV.state === "installing" && SV.log.some(l => /Node\.js|likec4@/.test(l)) && !SV.log.some(l => l.includes("> mkdocs serve")))
    return ["busy", "Ставлю Node.js и likec4 для диаграмм (только в первый раз)"];
  if (SV.state === "installing") return ["busy", "Ставлю mkdocs и плагины (только в первый раз)"];
  if (SV.state === "starting") return ["busy", "Собираю сайт, первая сборка около минуты"];
  if (SV.state === "running" && SV.building) return ["busy", "Пересобираю после изменений"];
  if (SV.state === "running") return ["run", !mine ? "Запущен сайт другого проекта"
    : SV.no_node ? "Сайт работает, но без C4-диаграмм: на компьютере нет Node.js"
    : "Сайт работает и сам обновляется после правок"];
  if (SV.state === "error") {
    if (SV.log.some(l => l.includes("command not found. Ensure Node.js"))) return ["err", "Для C4-диаграмм нужен Node.js и likec4. Поставь их или включи галочку «Быстро» и нажми «Перезапустить»"];
    if (SV.log.some(l => l.includes("parsing the configuration file"))) return ["err", "Ошибка в mkdocs.yml: подробности в красном блоке над меню (нажми «Проверить снова», если его нет)"];
    return ["err", SV.error || "Ошибка, смотри лог"];
  }
  return ["idle", "Локальный сайт не запущен"];
}
function renderServe() {
  const b = $("#serveBtn");
  const busy = ["installing", "starting"].includes(SV.state) || (SV.state === "running" && SV.building);
  b.className = SV.state === "running" && !SV.building ? "run" : busy ? "busy" : "";
  b.innerHTML = SV.state === "running" ? (SV.building ? ic("loader", "spin") + "Пересборка..." : `<span class="dot"></span>Сайт запущен${SV.fast ? " (быстро)" : ""}`)
    : busy ? ic("loader", "spin") + "Запускаю..." : SV.state === "error" ? ic("warn") + "Сайт: ошибка" : ic("play") + "Проверить локально";
  b.title = SV.url ? SV.url : "Запустить mkdocs serve и посмотреть сайт в браузере";
  if (svModal) {
    const [k, text] = svLabel();
    $("#svState").className = "sstate " + k;
    $("#svState").innerHTML = (k === "busy" ? ic("loader", "spin") : k === "run" ? `<span class="dot"></span>` : k === "err" ? ic("warn") : ic("info")) + `<span>${esc(text)}</span>`;
    const lg = $("#svLog"), atBottom = lg.scrollTop + lg.clientHeight >= lg.scrollHeight - 30;
    lg.textContent = SV.log.join("\n") || "Лог появится после запуска";
    if (atBottom) lg.scrollTop = lg.scrollHeight;
    $("#svOpen").disabled = SV.state !== "running";
    $("#svStop").disabled = SV.state === "idle";
    const nodeErr = SV.log.some(l => l.includes("command not found. Ensure Node.js"));
    const showNode = SV.can_install_node && (SV.no_node || nodeErr) && SV.state !== "installing";
    $("#svNode").innerHTML = showNode ? `<div class="note warn" style="align-items:center">${ic("warn")}
      <span class="grow">Для C4-диаграмм нужен Node.js. Программа скачает портативный Node.js LTS с nodejs.org (около 30 МБ) и likec4 в свою папку.
      Права администратора не нужны, в систему ничего не ставится.</span>
      <button class="primary" id="svNodeBtn">${ic("download")}Поставить Node.js и likec4</button></div>` : "";
    if ($("#svNodeBtn")) $("#svNodeBtn").onclick = async () => {
      try { SV = await api("/api/serve/install-node", {repo: S.repo}); } catch (e) { toast(e.message, "err"); }
      renderServe(); pollServe();
    };
    const fresh = SV.state === "idle" || SV.repo !== S.repo;
    $("#svStart").innerHTML = ic(fresh ? "play" : "refresh") + (fresh ? "Запустить" : "Перезапустить");
    $("#svStart").className = SV.state === "running" ? "" : "primary";
    $("#svOpen").className = SV.state === "running" ? "primary" : "";
  }
  if (S) renderTree();
}
async function pollServe() {
  try { SV = await api("/api/serve"); } catch (e) { return; }
  const prev = renderServe._last; renderServe._last = SV.state + SV.building;
  if (prev !== renderServe._last || svModal) renderServe();
  if (prev && prev.startsWith("starting") && SV.state === "running") toast("Локальный сайт готов");
  clearTimeout(svTimer);
  const active = ["installing", "starting"].includes(SV.state) || SV.building || svModal;
  svTimer = setTimeout(pollServe, active ? 1200 : 5000);
}
function openServeModal() {
  modal("Проверить локально", `
    <div id="svState" class="sstate idle"></div>
    <div class="small muted" style="margin-top:8px">Запускается mkdocs serve для проекта <b>${esc(S.name)}</b>. Сайт сам пересобирается после каждой правки здесь. Окно run.bat не закрывай, вместе с ним остановится и сайт.</div>
    <label class="check"><input type="checkbox" id="svFast" ${fastMode() ? "checked" : ""}>
      <span><b>Быстро, без диаграмм likec4.</b> <span class="muted">Сборка за секунды, но C4-диаграммы на сайте будут пустыми. Без галочки сборка и каждая пересборка идут 1-2 минуты.</span></span></label>
    <div id="svNode"></div>
    <div class="slog" id="svLog"></div>`,
    [{text: ic("stop") + "Остановить", onClick: async () => { try { toast((await api("/api/serve/stop", {})).message, "info"); } catch (e) { toast(e.message, "err"); } pollServe(); return true; }},
     {text: ic("play") + "Запустить", onClick: startServe},
     {text: ic("ext") + "Открыть сайт", cls: "primary", onClick: () => { window.open(SV.url, "_blank"); return true; }}]);
  const f = document.querySelectorAll("#mFoot button");
  f[0].id = "svStop"; f[1].id = "svStart"; f[2].id = "svOpen";
  $("#svFast").onchange = e => {
    fastPref = e.target.checked;
    try { localStorage.setItem("navtool.fast", fastPref ? "1" : "0"); } catch (x) {}
    if (SV.state !== "idle") toast("Нажми «Перезапустить», чтобы применить", "info");
  };
  svModal = true;
  renderServe(); pollServe();
}
let fastPref = null;
function fastMode() {
  if (fastPref === null) { try { fastPref = localStorage.getItem("navtool.fast") === "1"; } catch (e) { fastPref = false; } }
  return fastPref;
}
async function startServe() {
  try { SV = await api("/api/serve/start", {repo: S.repo, fast: fastMode()}); } catch (e) { toast(e.message, "err"); }
  renderServe(); pollServe();
  return true;
}
$("#serveBtn").onclick = openServeModal;
pollServe();

/* ================= старт ================= */
(async () => {
  try {
    const h = await api("/api/home");
    if (h.last && await load(h.last)) { $("#app").classList.remove("hidden"); browsePath = h.last; resetForm(); return; }
  } catch (e) {}
  showPicker();
})();
</script>
</body>
